# We use this unstable feature to have consistent import grouping.
# https://rust-lang.github.io/rustfmt/?search=#group_imports
group_imports = "StdExternalCrate"
# The bundle is tsrs's code as upstream formats it, and a fresh run of
# `mise run rakko -- bundle-tsrs` must reproduce it byte for byte.
ignore = ["crates/stiles-tsrs", "vendor"]
