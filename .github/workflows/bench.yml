---
name: Benchmarks

# The benchmarks run on a macro runner of CodSpeed, which is bare metal and
# quiet enough to tell a regression from noise. The runner costs minutes from
# a monthly allowance, so the corpus runs once a week, and on a pull request
# only when a maintainer adds the `bench` label.
"on":
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # A week without a merge leaves main where the last run measured it, and a
  # second run of the same commit spends the minutes for nothing. The check
  # runs on a runner of GitHub, because a job on the macro runner spends its
  # minutes even when it stops at once.
  changes:
    name: Look for a change since the last run
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'

    permissions:
      actions: read # The check reads the earlier runs of this workflow.

    outputs:
      changed: ${{ steps.compare.outputs.changed }}

    steps:
      - name: Compare main with the last successful run
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          last=$(gh run list --repo "${REPOSITORY}" --workflow bench.yml \
              --branch main --status success --limit 1 \
              --json headSha --jq '.[0].headSha // ""')

          if [ "${last}" = "${HEAD}" ]; then
              echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
              echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

  benchmarks:
    name: Run the benchmarks
    runs-on: codspeed-macro
    # A job that hangs would spend the minutes of the runner until GitHub
    # stops it after six hours. The first run of the corpus died after about
    # an hour, so two hours leave room for a run that works.
    timeout-minutes: 120

    # Only a scheduled run asks `changes`, so the job also runs when that one
    # skipped. A run by hand or on a labeled pull request always measures.
    needs: changes
    if: >-
      always()
      && (needs.changes.result == 'skipped'
      || needs.changes.outputs.changed == 'true')
      && (github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'bench'))

    permissions:
      contents: read # The checkout reads the repository.
      id-token: write # CodSpeed authenticates the upload through OIDC.

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      # The harness fetches each project, builds the rules, warms up, and
      # records the phases, so that `codspeed.yml` finds the checkouts ready.
      # Each project prepares in a step of its own: a runner that dies takes
      # the log of the job with it, and the step that it died in still names
      # the project.
      - name: Prepare stiles
        run: mise run rakko -- bench --project stiles

      - name: Prepare rust-analyzer
        run: mise run rakko -- bench --project rust-analyzer

      - name: Prepare typescript
        run: mise run rakko -- bench --project typescript

      - name: Prepare trpc
        run: mise run rakko -- bench --project trpc

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime

      # CodSpeed shows the wall time of each project, and its flame graphs
      # show where a run went. The harness also records the time of each
      # phase, which the artifact keeps beside the run.
      - name: Keep the results of the harness
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: |
            target/bench/results.json
            target/bench/*/timings.json
          if-no-files-found: ignore
