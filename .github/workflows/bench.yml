---
name: Benchmarks

# The benchmarks run on a macro runner of CodSpeed, which is bare metal and
# quiet enough to tell a regression from noise. The runner costs minutes from
# a monthly allowance, so the corpus runs once a week, and on a pull request
# only when a maintainer adds the `bench` label.
"on":
  schedule:
    - cron: "17 3 * * 1"
  pull_request:
    types: [labeled, synchronize]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Run the benchmarks
    runs-on: codspeed-macro

    # The repository variable switches the workflow on once CodSpeed is
    # enabled for the repository. Without it, no job reaches the runner, and
    # no minute is spent.
    if: >-
      vars.CODSPEED_BENCHMARKS == 'true' && (github.event_name != 'pull_request'
      || contains(github.event.pull_request.labels.*.name, 'bench'))

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      # The harness fetches each project, builds the rules, and warms up, so
      # that `codspeed.yml` finds the checkouts ready. One timed run keeps the
      # minutes of the preparation low. Its results stay on the runner.
      - name: Prepare the corpus
        run: mise run rakko -- bench --runs 1

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5.6.3
        with:
          mode: walltime

      # CodSpeed shows the wall time of each project, and its flame graphs
      # show where a run went. The harness also records the time of each
      # phase and the peak memory, which the artifact keeps beside the run.
      - name: Keep the results of the harness
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-results
          path: |
            target/bench/results.json
            target/bench/*/timings.json
            target/bench/*/hyperfine.json
          if-no-files-found: ignore
