---
name: Publish

# A release ends at the GitHub release, and this workflow takes its crates to
# crates.io from there. It triggers on `published` and not on `released`,
# because `released` never fires for a pre-release, and a pre-release reaches
# crates.io as well.
"on":
  release:
    types: [published]

permissions: {}

# Each tag publishes in its own group, so two releases do not wait for each
# other. A publish is never cancelled, because a cancel can stop it after some
# crates have reached crates.io and before the others did. A re-run of the
# workflow finishes such a publish, since Otto skips each crate that crates.io
# already holds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for trusted publishing

    steps:
      # On a release event, the checkout takes the commit of the tag that the
      # release names, which is what the workflow publishes.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `cargo publish` builds each crate before the upload, with the
      # toolchain that `mise.toml` pins. The shared setup action is not used
      # here, because it installs every tool of the repository and restores a
      # cache, and a publish needs only the toolchain.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: 2026.10.21
          install_args: jq rust
          cache: false

      # Otto runs the publish. Only this job needs it, so the job installs it
      # instead of `mise.toml`, which every job of CI installs. The version is
      # exact, so a new release of Otto reaches this workflow through a pull
      # request that changes this line.
      - name: Install Otto
        run: cargo install otto --version 0.1.0 --locked

      # A token for trusted publishing cannot create a crate, and it covers
      # only the crates whose trusted publisher exists when the token is
      # requested. The placeholders therefore come first. For each crate that
      # crates.io does not hold, Otto publishes an empty version 0.0.0, adds
      # this workflow as its trusted publisher, and turns on the requirement
      # for trusted publishing. A crate that crates.io holds stays as it is.
      # The secret is an API token with the scopes `publish-new` and
      # `trusted-publishing`, limited to the crates whose names start with
      # `stiles`. Otto reads the workflow to trust from `GITHUB_WORKFLOW_REF`,
      # which GitHub sets, and the release unit from the checkout of the tag.
      - name: Create the placeholders
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PLACEHOLDER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: otto --verbose create-placeholders

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Under `--verbose`, the log of the job shows whether the command
      # publishes or skips each crate, and each crate as crates.io accepts
      # its upload. The tag reaches the script through `TAG`, so that no text
      # of the event reaches the script itself.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: otto --verbose publish-crates --tag "$TAG"

      # Each command of Otto also writes its whole log to a file in the data
      # directory of the user. The files of the runner are gone after the
      # job, so a job that failed keeps them as an artifact. An artifact
      # keeps its name within a run of the workflow, so each attempt of a
      # re-run uploads under a name of its own.
      - name: Keep the logs of Otto
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otto-logs-${{ github.run_attempt }}
          path: ~/.local/share/otto/projects/
          if-no-files-found: ignore
