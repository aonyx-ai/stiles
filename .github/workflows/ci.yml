---
name: Continuous Integration

"on":
  pull_request:
  # A cache is scoped to the ref that wrote it, and a pull request can read
  # only its own ref and the default branch. With pull requests alone,
  # nothing ever wrote a cache on main, so every pull request started cold
  # and saved a copy that only it would ever read. Running on main is what
  # gives every pull request something to restore.
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commands:
    name: Enumerate the commands
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      commands: ${{ steps.export-commands.outputs.commands }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      - name: Restore Cargo downloads and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            tools/rakko/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # The help of the harness lists what this repository mounts, so an
      # action that the harness gains reaches CI without a change to this
      # file. The prefix picks the commands that a job runs: `pre-commit`
      # drives the actions that the job below already runs one by one, and
      # `help` is not a check. A written command that is a check therefore
      # has to carry one of these prefixes to reach CI.
      #
      # The help is text that clap lays out, and a release of clap may lay it
      # out differently. An empty list would skip the whole matrix and read as
      # a pull request that has nothing to run, so an empty one fails here.
      - name: Export the commands
        id: export-commands
        run: |
          listed=$(mise run rakko -- --help |
            awk '/^Commands:/ { list = 1; next }
                 /^$/         { list = 0 }
                 list && /^  (build|check|format|lint|test)-/ { print $1 }')

          if [ -z "${listed}" ]; then
            echo "The help of the harness listed no command to run." >&2
            exit 1
          fi

          commands=$(jq --compact-output --null-input --raw-input '[inputs]' <<< "${listed}")

          echo "commands=${commands}" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs: commands

    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJson(needs.commands.outputs.commands) }}

    steps:
      # Only the check of the bundle reads tsrs. Every other job builds the
      # generated crate, so it skips the download of the submodule.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false
          submodules: ${{ matrix.command == 'check-bundle-tsrs' }}

      - name: Set up the tools
        uses: $/.github/actions/setup

      # Every workspace of the repository builds in its own target directory,
      # and the harness builds in `tools/rakko/target` before any command
      # runs, so the entry holds both.
      - name: Restore Cargo downloads and build output
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            tools/rakko/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-${{ runner.os }}-

      # `check-self` alone builds in release, so `target/release` is its own
      # and the entry above never holds one. It restores second, beside the
      # `target/debug` that entry carries.
      - name: Restore the release build output
        if: matrix.command == 'check-self'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'mise.toml') }}
          restore-keys: cargo-release-${{ runner.os }}-

      # Stiles builds the pinned rules once and keeps them here. No stale
      # revision is worth restoring, so the key has no prefix to fall back to.
      - name: Restore the built lint sources
        if: matrix.command == 'check-self'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/stiles
          key: lints-${{ runner.os }}-${{ hashFiles('.config/stiles.toml', 'mise.toml') }}

      # The task hands every argument to the harness untouched, and the harness
      # is what a contributor runs as well, so a job of CI and a machine of a
      # contributor answer the same question with the same command.
      - name: Run the command
        # Zizmor resolves action pins against the GitHub API, and it skips
        # those audits silently when it finds no token, so `lint-github-actions`
        # would pass while auditing less than it reports. The token is granted
        # to every command rather than to that one alone, so that renaming a
        # command cannot quietly take the audits away again.
        env:
          COMMAND: ${{ matrix.command }}
          GH_TOKEN: ${{ github.token }}
        run: mise run rakko -- "$COMMAND"

      # One job writes the cache, on one branch. Every job in this matrix
      # shares one key, and a key cannot be overwritten once it exists, so
      # whichever job finished first used to claim it. `lint-markdown` won
      # that race often enough to leave a 3 MB archive holding no build
      # output at all, which every Rust job then restored and ignored.
      # `test-rust` builds every target and its test binaries, so its
      # directory is the one worth keeping.
      - name: Save Cargo downloads and build output
        if: github.event_name == 'push' && matrix.command == 'test-rust'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
            tools/rakko/target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'mise.toml') }}

      - name: Save the release build output
        if: github.event_name == 'push' && matrix.command == 'check-self'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/release
          key: cargo-release-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', 'mise.toml') }}

      - name: Save the built lint sources
        if: github.event_name == 'push' && matrix.command == 'check-self'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/stiles
          key: lints-${{ runner.os }}-${{ hashFiles('.config/stiles.toml', 'mise.toml') }}

  # Stiles publishes a binary for Windows, and on Windows it builds each rule
  # as a DLL and loads it at run time. The harness runs every other check on
  # Linux, so this job runs the tests of the binary on Windows. They build
  # rules, load them, and check projects with them.
  windows:
    name: Test stiles on Windows
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      # `mise.lock` records no download for Windows, so the shared setup
      # cannot install the tools here. Mise installs only Rust, which needs no
      # download from the lockfile, and the runner already carries jq for the
      # task that the install starts.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: 2026.11.7
          install_args: rust
          cache: false

      - name: Test the binary
        shell: bash
        # The tests of the library and of each binary are separate targets, and
        # the tests that load rules are among the last. A failure in one target
        # would otherwise hide the result of every target after it.
        run: cargo test --locked --no-fail-fast -p stiles

  success:
    name: All checks succeeded
    runs-on: ubuntu-latest

    permissions:
      pull-requests: read # Required to find an open release pull request

    needs: [checks, windows]
    if: always()

    steps:
      - name: Check if all checks succeeded
        # `needs` is a list of job names, which themselves are generated from
        # the help of the harness, so we ignore the template injection here.
        # zizmor: ignore[template-injection]
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'

      # Otto refuses to merge a release when main moved after it cut the
      # release branch. Renovate automerges a pull request as soon as this
      # check passes, so its pull requests wait while a release is open. The
      # release moves main when it merges, Renovate rebases, and this check
      # runs again. The step runs last, so it sees a release that opened
      # while the other checks ran.
      - name: Hold Renovate while a release is open
        if: github.event_name == 'pull_request'
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${AUTHOR}" != "renovate[bot]" ]; then
            exit 0
          fi
          releases="$(gh pr list --repo "${REPOSITORY}" --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/"))] | length')"
          if [ "${releases}" -gt 0 ]; then
            echo "::error::a release pull request is open, so this pull request waits for it to merge"
            exit 1
          fi
