---
name: Docs

"on":
  pull_request:
  push:
    branches:
      - main
  release:
    types: [released]
  workflow_dispatch:

permissions: {}

# A deployment that started always completes, and the next run waits for it.
# A newer push to a pull request replaces its build and its preview, so an
# older run can stop.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      - name: Build the documentation
        working-directory: docs
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    # A release deploys the site, and a prerelease does not: the pages
    # name the version a reader downloads, and a release candidate is not
    # it. Running this workflow by hand deploys too, which is how the site
    # goes up between releases.
    if: >-
      (github.event_name == 'release' && github.event.action == 'released')
      || (github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main')

    permissions:
      contents: read

    environment:
      name: production
      url: https://stiles.aonyx.ai

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      - name: Build the documentation
        working-directory: docs
        run: |
          npm ci
          npm run build

      # The account of the Worker comes from a secret rather than from the
      # committed configuration, because this repository is public.
      - name: Deploy the documentation
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: deploy

  preview:
    name: Preview
    runs-on: ubuntu-latest

    # A pull request from a fork gets no secrets, so it cannot upload.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    # The environment puts a link to the preview on the pull request. The alias
    # gives each pull request one URL that every push updates.
    environment:
      name: preview
      url: https://pr-${{ github.event.pull_request.number }}-stiles.aonyx.workers.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      # Docusaurus writes every link relative to its base URL, so the preview
      # needs no address of its own. Only the canonical links name the live
      # site.
      - name: Build the documentation
        working-directory: docs
        run: |
          npm ci
          npm run build

      # An upload makes a version without deploying it, so stiles.aonyx.ai
      # keeps serving the last release.
      - name: Upload the preview
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs
          command: versions upload --preview-alias pr-${{ github.event.pull_request.number }}
