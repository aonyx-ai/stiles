---
name: Release binaries

"on":
  release:
    # `published` fires once, for a release and for a prerelease alike.
    # `released` would skip a prerelease entirely, which is the one kind
    # of release worth building binaries for before anyone depends on
    # them. It also fires a second time when a prerelease is promoted,
    # and the archives from the first run are still the right ones.
    types: [published]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  archives:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write # Required to attach the archives to the release

    strategy:
      fail-fast: false
      matrix:
        # A binary asks its build machine's glibc for a floor, and the
        # oldest runner sets the oldest distribution that can run it.
        # Ubuntu 24.04 carries glibc 2.39, which refuses Ubuntu 22.04 LTS
        # and Debian 12. Ubuntu 22.04 carries 2.35, which both accept.
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            runner: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runners ship no toolchain at the version that `mise.toml` pins, so
      # mise installs it, and the pin lives in one place. The shared setup
      # action is not used here, because it restores a cache, and this job
      # deliberately keeps none. Only the toolchains and jq are installed:
      # jq runs the task that `mise install` starts after an install.
      - name: Install the pinned toolchain
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: 2026.10.21
          install_args: jq rust
          cache: false

      - name: Add the target to the toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: rustup target add "${TARGET}"

      # This job deliberately keeps no Cargo cache. Every other workflow
      # here restores one, but a cache that a pull request can write is a
      # way to reach the binary a release publishes. A release builds once
      # per tag, so the minutes a cache would save are worth less than the
      # guarantee that the archive came from this source alone.

      # The archive holds the binary, both licenses, and the README. A
      # sidecar beside it carries the SHA-256 digest, so a download can be
      # verified with `shasum -a 256 -c`. The harness only reads and repairs
      # the tree, and no action packages a release, so the workflow runs the
      # steps itself.
      - name: Assemble the archive
        env:
          TAG: ${{ github.event.release.tag_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          target="${TARGET}"

          # The tag names the version, and `Cargo.toml` names it too. A tag that
          # disagrees would ship an archive whose name promises a version the
          # binary does not report, so the disagreement stops the release here.
          #
          # A prerelease tag such as `v0.1.0-rc.1` carries a suffix that the
          # crate version never holds, and the binary reports `0.1.0` whatever
          # the suffix says. The comparison therefore drops the suffix, while
          # the archive keeps the whole tag in its name.
          release="${version%%-*}"
          pinned="$(cargo pkgid -p whisker)"
          pinned="${pinned##*#}"
          pinned="${pinned##*@}"
          if [ "${release}" != "${pinned}" ]; then
              echo "the tag names version ${release}, but Cargo.toml holds ${pinned}" >&2
              exit 1
          fi

          cargo build --release --locked -p whisker --target "${target}"
          whisker="target/${target}/release/whisker"
          "${whisker}" --version

          # The archive's name promises a platform, and the binary decides which
          # prebuilt lints it asks a publisher for. A disagreement would send
          # everyone who unpacks this archive looking for artifacts that were
          # never published under that name, so the two are compared here.
          tag="$("${whisker}" abi)"
          if [ "${tag#*-}" != "${target}" ]; then
              echo "the binary is built for ${tag#*-}, but the archive names ${target}" >&2
              exit 1
          fi

          name="whisker-${version}-${target}"
          rm -rf "dist/${name}"
          mkdir -p "dist/${name}"
          cp "target/${target}/release/whisker" "dist/${name}/"
          cp LICENSE-APACHE LICENSE-MIT README.md "dist/${name}/"

          # Short flags, because macOS ships bsdtar and its support for the
          # GNU long spellings is not something a release should rely on.
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          rm -rf "dist/${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "${TAG}" dist/*.tar.gz dist/*.sha256 --clobber
