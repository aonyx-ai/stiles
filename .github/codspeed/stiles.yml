---
# CodSpeed reads this file in the job of the `Benchmarks` workflow that
# measures stiles. The job copies it to `codspeed.yml` after `bench` has
# prepared the project, so the checkout below exists and the rules are built.
# The harness warms up the project, so CodSpeed does not. Three rounds bound
# the minutes that the job spends on the runner.
options:
  warmup-time: 0s
  max-rounds: 3

benchmarks:
  - name: stiles
    # Stiles exits with 1 when it reports findings or a file stays
    # uncovered, and every project of the corpus has both. CodSpeed fails a
    # benchmark that exits with anything but 0, so the shell maps 1 to 0. A
    # crash exits with another code and still fails the benchmark.
    exec: >-
      sh -c 'target/release/stiles check --keep-going
      target/bench/stiles/checkout; test $? -le 1'
