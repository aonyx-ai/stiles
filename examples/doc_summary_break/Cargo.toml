# <
# Requires a newline after the first line of a docstring.
#
# This example exists for the documentation to import. The manifest is what
# a reader copies, so it names the released Stiles crates on crates.io. CI
# resolves that release, so it proves that the manifest on the page builds
# against the version it names. Whether the current branch still suits the
# rule is a question for Stiles's own tests.

# The empty workspace table keeps this package standalone inside the
# Stiles repository; a plugin in your own project does not need it. It is
# also what gives this package its own lockfile, and that is the point: a
# reader copying the manifest resolves it standalone too.
[workspace]
# >

[package]
name = "doc_summary_break"
version = "0.1.0"
edition = "2024"
publish = false
# <
# The license is for the dependency check of this repository, which reads
# this package as a workspace of its own. A plugin in your own project
# carries whatever license that project chooses.
license = "Apache-2.0 OR MIT"
# >

[dependencies]
stiles-plugin = "=0.1.0"
stiles-rust = { version = "=0.1.0", default-features = false }
stiles-types = "=0.1.0"

[lib]
crate-type = ["cdylib"]

# <
[dev-dependencies]
stiles-testing = "=0.1.0"
# >
