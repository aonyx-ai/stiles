# A custom lint plugin: stiles compiles this package at check time and
# loads the produced dynamic library, so the crate type must be cdylib.
# The stiles dependencies must match the revision the stiles binary was
# built from; a project outside this repository uses git dependencies
# pinned to that revision instead of path dependencies. The lockfile beside
# this manifest is part of that: stiles's handshake compares its own
# source, not the versions a plugin resolves for what stiles itself
# depends on. The provider feature stays off, because a lint needs the
# trait and the decoration types, not the rust-analyzer stack behind the
# decoration provider.
#
# The empty workspace table keeps this package standalone inside the
# stiles repository; a plugin in your own project does not need it.
[workspace]

[package]
name = "custom_lint"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
stiles-plugin = { path = "../../crates/stiles-plugin" }
stiles-rust = { path = "../../crates/stiles-rust", default-features = false }
stiles-types = { path = "../../crates/stiles-types" }

[dev-dependencies]
stiles-testing = { path = "../../crates/stiles-testing" }
