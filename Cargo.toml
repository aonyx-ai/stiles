[workspace]
members = ["crates/*", "tools/bundle-tsrs"]
# A lint plugin is never a member, because stiles builds and loads it the way
# it loads a plugin from outside this repository. The two plugins in `examples`
# declare a workspace of their own, so they need no entry here. The lint
# plugin of the tests cannot, because stiles-rust depends on it by path. The
# sample projects are the code that the tests check, not code of this
# repository. `tools/rakko` is a workspace of its own, so the members name the
# generator of the tsrs bundle and not the whole directory. `vendor` holds the
# tsrs submodule, which `tools/bundle-tsrs` reads and nothing builds.
exclude = [
  "crates/stiles-rust/tests/fixtures/lints/decoration_probes",
  "crates/stiles-rust/tests/fixtures/sample_project",
  "examples/sample_project",
  "vendor",
]

# Opt-in to the new feature resolver introduced in Rust 1.85 and Edition 2024.
# https://doc.rust-lang.org/cargo/reference/resolver.html#resolver-versions
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"

license = "Apache-2.0 OR MIT"
repository = "https://github.com/aonyx-ai/stiles.git"

[workspace.lints.clippy]
# Every `unsafe` block states the reason it is sound, next to the block.
undocumented_unsafe_blocks = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# The lint conflicts with lint.matches-macro of the rules. Clippy asks for
# `matches!` in place of a `match` that yields `bool` literals and ends in a
# wildcard, and the rule asks for that `match` in place of `matches!`.
match_like_matches_macro = "allow"

# The tests run rust-analyzer far more than they compile it.
[profile.dev.package."*"]
opt-level = 2

[workspace.dependencies]
anyhow = "1"
# Generates the builders that name each field at the call site, in place of
# constructors that take their arguments by position.
bon = "3"
codespan-reporting = "0.13"
# Finds the directory stiles keeps fetched lint sources in. etcetera rather
# than `dirs` or `directories`, because stiles wants the XDG layout on every
# platform: a cache under `~/Library/Caches` on macOS would sit apart from the
# one a container or a continuous integration job restores.
etcetera = "0.11"
# Derives the getters of a struct whose fields stay private, so a caller reads
# a field without being able to change it.
getset = "0.1"
# Fetches git-sourced lint plugins. Gitoxide rather than the git CLI so that
# stiles's own behavior does not depend on which git a machine has, or on
# whether it has one; the fetch asks the remote for the single pinned commit
# and nothing else.
#
# The feature list is the smallest one that fetches and checks out. `parallel`
# is on that list because it makes gitoxide's object store shareable between
# threads, which the checkout requires. `max-performance-safe` would add it
# along with pack caches that buy nothing here — one shallow fetch of one
# commit — so the feature is named directly instead.
#
# `gix::url` also reads the remote a lint entry names, so the configuration and
# the fetch agree on what a remote is. Stiles took that parser from `gix-url`
# directly until gitoxide 0.87 moved the two crates apart, and a remote parsed
# by one version cannot be handed to a fetch built on the other.
gix = { version = "0.90", default-features = false, features = [
  "blocking-network-client",
  "blocking-http-transport-reqwest-rust-tls",
  "worktree-mutation",
  "index",
  "parallel",
  "sha1",
] }
# Decompresses an archive of prebuilt lints. Its `zlib-rs` backend is the
# one gitoxide already builds, so naming it saves a second copy of the
# same algorithm.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# Reads and writes the SHA-256 digest that travels beside an archive of
# prebuilt lints.
hex = "0.4"
# The walker behind ripgrep. Stiles uses it instead of a plain directory walk
# so that `.gitignore` and friends are honored: a linter that reports on
# generated output such as `target/` is worse than no linter at all.
ignore = "0.4"
# Finds the project a `stiles check` run targets, and reads the
# configuration file at the top of it. Stiles used to walk the directory
# tree itself. The crate does the same walk, but it is the walk every Aonyx
# tool does, so `.config/stiles.toml` sits where a user already expects a
# tool's configuration to sit, and a broken file is reported in the same
# words with the same line and column.
kawauso-project = "0.3.0"
# Loads custom lint plugins.
libloading = "0.9"
proptest = "1"
ra_ap_hir = "0.0.358"
ra_ap_ide_db = "0.0.358"
ra_ap_load-cargo = "0.0.358"
ra_ap_project_model = "0.0.358"
ra_ap_syntax = "0.0.358"
ra_ap_vfs = "0.0.358"
proc-macro2 = "1"
quote = "1"
# Asks a GitHub release for prebuilt lints and downloads them. Reqwest
# rather than a smaller client, because gitoxide already fetches over it,
# so both share one HTTP stack and one set of trusted roots.
reqwest = { version = "0.13", default-features = false, features = [
  "blocking",
  "rustls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Checks an archive of prebuilt lints against the digest its publisher
# put beside it, which catches a truncated or corrupted download.
sha2 = "0.11"
# Lays out the types that cross the plugin boundary so that a plugin one
# rustc built loads into a stiles another built. Its strings, lists, and
# reference counts free memory through the allocator that made them.
stabby = "72.1"
syn = { version = "3", features = ["full", "extra-traits"] }
# Unpacks an archive of prebuilt lints. The `xattr` feature is off,
# because a lint library carries no extended attributes.
tar = { version = "0.4", default-features = false }
tempfile = "3"
# Derives the typed errors that a public function returns, so that a caller
# can match on what went wrong.
thiserror = "2"
# Serves a release API to the tests that cover the download, so those
# tests exercise the HTTP client stiles ships rather than a stand-in.
tiny_http = "0.12"
toml = "1"
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
# Both grammars come from the one crate: `.ts` files parse with the
# TypeScript grammar and `.tsx` files with the TSX grammar, whose JSX
# syntax conflicts with TypeScript's angle-bracket type assertions.
tree-sitter-typescript = "0.23"
stiles-core = { path = "crates/stiles-core", version = "=0.3.0" }
stiles-macros = { path = "crates/stiles-macros", version = "=0.3.0" }
stiles-codegen = { path = "crates/stiles-codegen", version = "=0.3.0" }
stiles-reporting = { path = "crates/stiles-reporting", version = "=0.3.0" }
stiles-rust = { path = "crates/stiles-rust", version = "=0.3.0" }
stiles-types = { path = "crates/stiles-types", version = "=0.3.0" }
stiles-testing = { path = "crates/stiles-testing", version = "=0.3.0" }
# The TypeScript provider type-checks with tsrs, a Rust port of the
# TypeScript 7 checker, so analysis runs in stiles's process with no
# Node.js or Go toolchain. tsrs publishes no crates, and crates.io refuses a
# dependency on a repository, so `mise run rakko -- bundle-tsrs` repackages the tsrs crates
# that stiles uses as one crate. The `vendor/tsrs` submodule pins the commit;
# a bump is a deliberate change to the checker.
stiles-tsrs = { path = "crates/stiles-tsrs", version = "=0.3.0" }
