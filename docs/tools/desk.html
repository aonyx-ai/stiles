<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whisker docs desk</title>
<style>
  :root {
    --bg: #fbfaf8; --panel: #fff; --ink: #1d1b19; --muted: #6f6a64;
    --line: #e5e1dc; --accent: #2f5d8a; --todo: #a36b12; --drafted: #2f5d8a;
    --done: #2e7d4f; --warn: #b3261e; --soft: #f3f0ec;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171615; --panel: #1f1e1c; --ink: #ece8e3; --muted: #9a948d;
      --line: #34312e; --accent: #8db4dc; --todo: #e0a84a; --drafted: #8db4dc;
      --done: #7cc79a; --warn: #f2877f; --soft: #262422; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); display: grid;
    grid-template-columns: 290px 1fr; height: 100vh; }
  body.previewing { grid-template-columns: 290px 1fr 1fr; }
  #preview { display: none; border: 0; border-left: 1px solid var(--line);
    width: 100%; height: 100vh; background: #fff; }
  body.previewing #preview { display: block; }
  .tools { display: flex; gap: 6px; padding: 0 12px 6px; }
  .tools button { font: 13px inherit; flex: 1; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--panel); color: inherit; cursor: pointer; }
  .tools button.on { border-color: var(--accent); color: var(--accent); }
  .tools button:disabled { opacity: .5; cursor: default; }
  #synced { margin: 0 12px 4px; font: 11.5px/1.45 ui-monospace, monospace; color: var(--muted);
    white-space: pre-wrap; max-height: 160px; overflow-y: auto; }
  #synced.warn { color: var(--warn); }
  nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 12px 0; }
  nav h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 14px 16px 4px; }
  nav h4 { font-size: 13px; color: var(--muted); font-weight: 500;
    margin: 8px 16px 2px; }
  nav a { display: flex; gap: 8px; align-items: center; padding: 3px 16px 3px 24px;
    color: inherit; text-decoration: none; font-size: 14px; }
  nav a:hover { background: var(--soft); }
  nav a.active { background: var(--soft); font-weight: 600; }
  nav a .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar { width: 44px; height: 5px; border-radius: 3px; background: var(--line);
    display: flex; overflow: hidden; flex: none; }
  .bar i { display: block; height: 100%; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--warn); flex: none; }
  main { overflow-y: auto; padding: 24px 40px 120px; }
  .page { max-width: 860px; margin: 0 auto; }
  .path { color: var(--muted); font: 12px ui-monospace, monospace; }
  input, textarea, select { font: inherit; color: inherit; background: transparent;
    border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; width: 100%; }
  input:hover, textarea:hover { border-color: var(--line); }
  input:focus, textarea:focus { outline: none; border-color: var(--accent);
    background: var(--panel); }
  input.title { font-size: 26px; font-weight: 650; margin: 2px 0 6px -6px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
  .meta p { margin: 2px 0; }
  details.links { margin: 6px 0 18px; font-size: 13px; }
  details.links summary { cursor: pointer; color: var(--muted); }
  textarea { resize: none; overflow: hidden; }
  textarea.code, details.links textarea { font: 13.5px/1.55 ui-monospace, SFMono-Regular, monospace; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px 12px; margin: 14px 0; }
  section.conflict { border-color: var(--warn); }
  .head { display: flex; gap: 10px; align-items: center; }
  .head input { font-size: 18px; font-weight: 600; margin-left: -6px; }
  .head .anchor { width: 180px; font: 12px ui-monospace, monospace; color: var(--muted); }
  .intro-label { font-size: 13px; color: var(--muted); flex: 1; }
  .status { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; flex: none; }
  .status button { font: 12px/1 inherit; padding: 6px 9px; border: 0; background: none;
    color: var(--muted); cursor: pointer; }
  .status button + button { border-left: 1px solid var(--line); }
  .status button.on[data-s=todo] { background: var(--todo); color: #fff; }
  .status button.on[data-s=drafted] { background: var(--drafted); color: #fff; }
  .status button.on[data-s=done] { background: var(--done); color: #fff; }
  .kind { font-size: 11px; color: var(--muted); border: 1px dashed var(--line);
    border-radius: 5px; padding: 1px 6px; flex: none; }
  .brief { margin: 10px 0 6px; padding: 8px 12px; background: var(--soft);
    border-radius: 8px; font-size: 14px; }
  .brief .prompt { margin: 6px 0; }
  .brief .key { font-weight: 600; }
  .brief ul { margin: 4px 0 8px; padding-left: 18px; color: var(--muted); font-size: 13.5px; }
  .brief code, .facts code { font-size: 12.5px; }
  .foot { display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: var(--muted); min-height: 20px; margin-top: 4px; }
  .foot .warn { color: var(--warn); }
  .foot button { font: inherit; border: 1px solid var(--line); background: var(--panel);
    color: inherit; border-radius: 5px; padding: 2px 8px; cursor: pointer; margin-left: 6px; }
  #offline { position: fixed; top: 10px; right: 14px; background: var(--warn); color: #fff;
    padding: 4px 10px; border-radius: 6px; font-size: 13px; display: none; }
</style>
</head>
<body>
<nav><div class="tools">
  <button id="sync" title="Runs sync_docs.sh: pages with edits are rewritten in the working tree">Write to disk</button>
  <button id="toggle-preview" hidden>Preview</button>
</div><div id="synced"></div><div id="nav"></div></nav>
<main><div class="page" id="page"></div></main>
<iframe id="preview" title="Rendered page"></iframe>
<div id="offline">Reconnecting…</div>
<script>
"use strict";

const store = { files: new Map(), sections: new Map(), facts: new Map() };
let seq = 0;
let docsUrl = null;
let current = location.hash.slice(1) || null;
const STATUSES = ["todo", "drafted", "done"];

const $ = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (v !== undefined && v !== null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined)
    el.append(kid instanceof Node ? kid : document.createTextNode(kid));
  return el;
};

// Renders inline `code` only; prompts and facts are plain prose otherwise.
const inline = (text) => {
  const span = $("span");
  String(text).split(/(`[^`]+`)/).forEach((part) =>
    span.append(part.startsWith("`") && part.endsWith("`") && part.length > 1
      ? $("code", {}, part.slice(1, -1)) : part));
  return span;
};

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json();
  return { ok: response.ok, status: response.status, body };
}

// Mirrors the Docusaurus routes: each content plugin serves its own folder.
function routeFor(path) {
  if (path === "src/pages/index.md") return "";
  const match = path.match(/^(docs|authoring)\/(.+)\.mdx?$/);
  return match ? `${match[1]}/${match[2]}` : null;
}

function showPreview() {
  const frame = document.getElementById("preview");
  const on = document.body.classList.contains("previewing");
  const route = routeFor(store.files.get(current)?.data?.path ?? "");
  if (!on || route === null) { if (route === null) frame.removeAttribute("src"); return; }
  const src = new URL(route, docsUrl).href;
  if (frame.getAttribute("src") !== src) frame.setAttribute("src", src);
}

async function sync() {
  const button = document.getElementById("sync");
  const out = document.getElementById("synced");
  for (const editor of editors.values()) await flush(editor);
  button.disabled = true;
  out.className = "";
  out.textContent = "Writing…";
  try {
    const { ok, body } = await api("/api/sync", { method: "POST" });
    out.className = ok && body.code === 0 ? "" : "warn";
    out.textContent = ok
      ? [body.stdout, body.code === 0 ? "" : body.stderr].join("\n").trim()
      : "A sync is already running.";
  } catch {
    out.className = "warn";
    out.textContent = "The desk did not answer.";
  }
  button.disabled = false;
}

async function loadAll() {
  const { body } = await api("/api");
  for (const map of Object.values(store)) map.clear();
  for (const doc of body.docs) store[doc.collection]?.set(doc.id, doc);
  seq = body.seq;
}

const files = () => [...store.files.values()]
  .sort((a, b) => (a.data.order ?? 0) - (b.data.order ?? 0));
const sectionsOf = (fileId) => [...store.sections.values()]
  .filter((s) => s.data.fileId === fileId)
  .sort((a, b) => (a.data.order ?? 0) - (b.data.order ?? 0));

function renderNav() {
  const nav = document.getElementById("nav");
  nav.replaceChildren();
  let area, category;
  for (const file of files()) {
    const d = file.data;
    if (d.area !== area) { area = d.area; category = null; nav.append($("h3", {}, area)); }
    if (d.category !== category) { category = d.category; nav.append($("h4", {}, category)); }
    const secs = sectionsOf(file.id);
    const count = (s) => secs.filter((x) => x.data.status === s).length;
    const bar = $("span", { class: "bar", title: STATUSES.map((s) => `${count(s)} ${s}`).join(", ") },
      ...["done", "drafted", "todo"].map((s) => $("i", {
        style: `width:${secs.length ? 100 * count(s) / secs.length : 0}%;background:var(--${s})`,
      })));
    const dirty = d.dirty || secs.some((s) => s.data.dirty);
    nav.append($("a", {
      href: `#${file.id}`, class: file.id === current ? "active" : "",
      title: dirty ? `${d.path} (carries desk edits)` : d.path,
    }, $("span", { class: "name" }, d.title || d.path), dirty ? $("span", { class: "dot" }) : null, bar));
  }
}

// One pending save per document, so typing never races its own writes.
const editors = new Map();

function editorFor(collection, id) {
  const key = `${collection}/${id}`;
  if (!editors.has(key)) editors.set(key, {
    collection, id, pending: {}, timer: null, saving: false, conflict: null, foot: null,
  });
  return editors.get(key);
}

function stage(editor, fields) {
  Object.assign(editor.pending, fields, { dirty: true });
  clearTimeout(editor.timer);
  editor.timer = setTimeout(() => flush(editor), 700);
  showState(editor, "Unsaved");
}

async function flush(editor, force = false) {
  clearTimeout(editor.timer);
  if (editor.saving || !Object.keys(editor.pending).length) return;
  if (editor.conflict && !force) return;
  const doc = store[editor.collection].get(editor.id);
  const fields = editor.pending;
  editor.pending = {};
  editor.saving = true;
  showState(editor, "Saving…");
  const { ok, status, body } = await api("/api/batch", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ writes: [{
      op: "patch", collection: editor.collection, id: editor.id,
      if_version: doc.version, data: fields,
    }] }),
  }).catch(() => ({ ok: false, status: 0, body: null }));
  editor.saving = false;
  if (ok) {
    const result = body.results[0];
    store[editor.collection].set(editor.id, result);
    editor.conflict = null;
    showState(editor, Object.keys(editor.pending).length ? "Unsaved" : `Saved v${result.version}`);
    if (Object.keys(editor.pending).length) flush(editor);
    renderNav();
    return;
  }
  editor.pending = { ...fields, ...editor.pending };
  if (status === 409 && body.current) {
    store[editor.collection].set(editor.id, body.current);
    editor.conflict = body.current;
    showConflict(editor);
  } else {
    showState(editor, "Save failed, retrying", true);
    editor.timer = setTimeout(() => flush(editor), 3000);
  }
}

function showState(editor, text, warn = false) {
  if (!editor.foot) return;
  editor.foot.replaceChildren($("span", { class: warn ? "warn" : "" }, text));
}

function showConflict(editor) {
  if (!editor.foot) return;
  editor.foot.closest("section")?.classList.add("conflict");
  editor.foot.replaceChildren(
    $("span", { class: "warn" }, `Changed elsewhere (now v${editor.conflict.version}).`),
    $("span", {},
      $("button", { onclick: () => { editor.pending = {}; editor.conflict = null; renderPage(); } }, "Take theirs"),
      $("button", { onclick: () => { editor.conflict = null; flush(editor, true).then(renderPage); } }, "Keep mine")));
}

function grow(area) {
  area.style.height = "auto";
  area.style.height = `${area.scrollHeight + 2}px`;
}

function field(editor, name, value, attrs = {}, multiline = false) {
  const shown = name in editor.pending ? editor.pending[name] : value ?? "";
  const el = multiline ? $("textarea", { rows: 1, spellcheck: "true", ...attrs }) : $("input", attrs);
  el.value = shown;
  el.dataset.doc = `${editor.collection}/${editor.id}`;
  el.dataset.field = name;
  el.addEventListener("input", () => { stage(editor, { [name]: el.value }); if (multiline) grow(el); });
  el.addEventListener("blur", () => flush(editor));
  if (multiline) requestAnimationFrame(() => grow(el));
  return el;
}

function factsFor(sectionId, key) {
  const items = store.facts.get(sectionId)?.data?.facts || [];
  return items.flatMap((item) => {
    if (typeof item === "string") return key === null ? [item] : [];
    const owner = item.key ?? item.prompt ?? null;
    if (owner !== key && !(key === null && owner === null)) return [];
    const text = item.fact ?? item.text ?? item.prose ?? item.facts;
    return Array.isArray(text) ? text : [text ?? JSON.stringify(item)];
  });
}

function renderBrief(section) {
  const brief = section.data.brief || [];
  const loose = factsFor(section.id, null);
  const keys = new Set(brief.map((p) => p.key));
  const orphaned = (store.facts.get(section.id)?.data?.facts || [])
    .filter((f) => typeof f === "object" && f !== null && (f.key ?? f.prompt) && !keys.has(f.key ?? f.prompt));
  if (!brief.length && !loose.length && !orphaned.length) return null;
  const list = (items) => items.length ? $("ul", { class: "facts" }, items.map((f) => $("li", {}, inline(f)))) : null;
  return $("div", { class: "brief" },
    brief.map((p) => $("div", { class: "prompt" },
      p.key ? $("span", { class: "key" }, `${p.key}: `) : null, inline(p.prose),
      list(factsFor(section.id, p.key)))),
    list(loose),
    list(orphaned.map((f) => `${f.key ?? f.prompt}: ${f.fact ?? f.text ?? f.prose ?? ""}`)));
}

function renderSection(section) {
  const d = section.data;
  const editor = editorFor("sections", section.id);
  const status = $("div", { class: "status" }, STATUSES.map((s) => $("button", {
    "data-s": s, class: (editor.pending.status ?? d.status) === s ? "on" : "",
    onclick: (event) => {
      stage(editor, { status: s });
      for (const b of event.target.parentNode.children) b.classList.toggle("on", b.dataset.s === s);
      flush(editor);
    },
  }, s)));
  const head = d.kind === "intro"
    ? $("div", { class: "head" }, $("span", { class: "intro-label" }, "Introduction"), status)
    : $("div", { class: "head" },
        field(editor, "heading", d.heading, { placeholder: "Heading", "aria-label": "Heading" }),
        field(editor, "anchor", d.anchor, { class: "anchor", placeholder: "{#anchor}", "aria-label": "Anchor" }),
        d.kind === "proposed" ? $("span", { class: "kind", title: "Only in the outline so far" }, "proposed") : null,
        status);
  const foot = $("div", { class: "foot" });
  editor.foot = foot;
  const el = $("section", { id: section.id }, head, renderBrief(section),
    field(editor, "body", d.body, { class: "code", placeholder: "Markdown", "aria-label": "Body" }, true),
    foot);
  if (editor.conflict) requestAnimationFrame(() => showConflict(editor));
  else if (Object.keys(editor.pending).length) showState(editor, "Unsaved");
  return el;
}

function draw() {
  const page = document.getElementById("page");
  const file = store.files.get(current) || files()[0];
  if (!file) { page.replaceChildren(); return; }
  current = file.id;
  const d = file.data;
  const editor = editorFor("files", file.id);
  const foot = $("div", { class: "foot" });
  editor.foot = foot;
  page.replaceChildren(...[
    $("div", { class: "path" }, d.path),
    field(editor, "title", d.title, { class: "title", placeholder: "Page title", "aria-label": "Page title" }),
    (d.meta || []).length ? $("div", { class: "meta" }, d.meta.map((m) => $("p", {}, inline(m)))) : null,
    $("details", { class: "links" }, $("summary", {}, "Link definitions"),
      field(editor, "links", d.links, { "aria-label": "Link definitions" }, true)),
    foot,
    sectionsOf(file.id).map(renderSection)].flat().filter(Boolean));
  renderNav();
  showPreview();
}

const renderPage = () => rerender();

// Applies a remote change in place unless this tab holds unsaved edits to it.
function applyChange(change) {
  const map = store[change.collection];
  if (!map) return;
  const known = map.get(change.id);
  if (!change.deleted && known && known.version >= change.version) return;
  const added = !known;
  if (change.deleted) map.delete(change.id); else map.set(change.id, change);
  const editor = editors.get(`${change.collection}/${change.id}`);
  const busy = editor && (Object.keys(editor.pending).length || editor.saving);
  if (busy) { if (!editor.saving) { editor.conflict = change; showConflict(editor); } return; }
  const affectsPage = change.id === current || change.data?.fileId === current ||
    change.id.startsWith(`${current}__`);
  if (!affectsPage) return;
  const node = document.getElementById(change.id);
  if (change.collection !== "files" && !added && !change.deleted && node) {
    node.replaceWith(renderSection(store.sections.get(change.id)));
    return;
  }
  renderPage();
}

// Rebuilds the page without losing the reader's place or the caret.
function rerender() {
  const main = document.querySelector("main");
  const focused = document.activeElement;
  const spot = focused?.dataset?.doc && {
    doc: focused.dataset.doc, field: focused.dataset.field,
    start: focused.selectionStart, end: focused.selectionEnd,
  };
  const scroll = main.scrollTop;
  draw();
  main.scrollTop = scroll;
  if (!spot) return;
  const again = document.querySelector(`[data-doc="${spot.doc}"][data-field="${spot.field}"]`);
  if (again) { again.focus({ preventScroll: true }); again.setSelectionRange?.(spot.start, spot.end); }
}

function listen() {
  const offline = document.getElementById("offline");
  const source = new EventSource(`/api/events?after=${seq}`);
  source.onopen = () => { offline.style.display = "none"; };
  source.onmessage = (event) => {
    const payload = JSON.parse(event.data);
    seq = payload.seq;
    payload.changes.forEach(applyChange);
    renderNav();
  };
  source.addEventListener("reset", async () => { source.close(); await loadAll(); renderPage(); listen(); });
  source.onerror = () => {
    offline.style.display = "block";
    source.close();
    setTimeout(async () => { try { await loadAll(); renderPage(); } catch {} listen(); }, 2000);
  };
}

window.addEventListener("hashchange", () => {
  for (const editor of editors.values()) flush(editor);
  current = location.hash.slice(1);
  renderPage();
  document.querySelector("main").scrollTop = 0;
});
window.addEventListener("beforeunload", (event) => {
  if ([...editors.values()].some((e) => Object.keys(e.pending).length)) event.preventDefault();
});

document.getElementById("sync").addEventListener("click", sync);
document.getElementById("toggle-preview").addEventListener("click", (event) => {
  document.body.classList.toggle("previewing");
  event.target.classList.toggle("on");
  showPreview();
});

api("/api/config").then(({ body }) => {
  docsUrl = body.docsUrl;
  document.getElementById("toggle-preview").hidden = !docsUrl;
});
loadAll().then(() => { renderPage(); listen(); });
</script>
</body>
</html>
