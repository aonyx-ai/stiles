[workspace]

[package]
name = "sample_project"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
# `syn` declares `Error` in a private `error` module and re-exports it at the
# crate root, so `Error`'s definition path and its public path differ.
syn = "3"
# `facade` re-exports parts of `facade_core`, and `lookalike_json` depends on
# `lookalike` without re-exporting it. Together they prove that the provider
# names a re-export only where rust-analyzer finds one.
facade = { path = "facade" }
facade_core = { path = "facade_core" }
lookalike = { path = "lookalike" }
lookalike_json = { path = "lookalike_json" }
