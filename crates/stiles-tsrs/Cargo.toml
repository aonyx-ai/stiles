# Generated by tools/bundle-tsrs from tsrs commit 4a61321929d0d62b86c5fb35f15bfa1607e03b50. Do not edit:
# change the tool or the submodule, and run `mise run rakko -- bundle-tsrs`.
# The bundle takes the version of the workspace, so it releases with stiles.
[package]
name = "stiles-tsrs"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "The TypeScript checker of tsrs, repackaged as one crate"
repository = "https://github.com/aonyx-ai/stiles.git"
readme = "README.md"
build = "build.rs"

[lib]
path = "src/lib.rs"
test = false
doctest = false
# rustdoc names a page after each item, and some diagnostic constants of
# tsrs have names longer than a file system allows in a file name.
doc = false

# The code is upstream's, so the bundle inherits none of stiles's lints.
[lints]

[dependencies]
bitflags = "2"
dragonbox_ecma = "0.1.12"
hashbrown = { version = "0.17", default-features = false, features = ["inline-more"] }
icu_normalizer = { version = "=2.4.0", default-features = false, features = ["compiled_data"] }
indexmap = "2"
memchr = "2"
num-bigint = "0.5.1"
num-traits = "0.2"
rayon = "1"
regex = "1"
rustc-hash = "2"
simdutf8 = "0.1.5"
smallbitvec = "2.6.1"
smallvec = { version = "1.16", features = ["union"] }
unicode-id-start = "=1.1.2"
xxhash-rust = { version = "0.8", features = ["const_xxh3", "xxh3"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1.5", features = ["fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
