[package]
name = "stiles-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A plugin depends on this crate for the export macro and the handshake
# constants. The language crates come without their decoration providers,
# whose analysis stacks a plugin never runs.
[dependencies]
stabby.workspace = true
stiles-rust = { path = "../stiles-rust", default-features = false }
stiles-types.workspace = true
stiles-typescript = { path = "../stiles-typescript", default-features = false }

[dev-dependencies]
tree-sitter.workspace = true

[lints]
workspace = true
