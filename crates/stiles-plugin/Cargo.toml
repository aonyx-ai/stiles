[package]
name = "stiles-plugin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "What a Stiles lint plugin needs to declare and export its rules"
repository.workspace = true

# A plugin depends on this crate for the export macro and the handshake
# constants. The language crates come without their decoration providers,
# whose analysis stacks a plugin never runs.
[dependencies]
stiles-rust = { path = "../stiles-rust", version = "=0.6.0", default-features = false }
stiles-types.workspace = true
stiles-typescript = { path = "../stiles-typescript", version = "=0.6.0", default-features = false }

[dev-dependencies]
tree-sitter.workspace = true

[build-dependencies]
stiles-codegen.workspace = true

[lints]
workspace = true
